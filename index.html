<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ابنِ سيرة ذاتية احترافية (سي في) متوافقة مع نظام ATS، واختر من أربعة نماذج سيرة ذاتية ونزّلها ملف Word، وحسّن ملفك على لينكد إن. منصة عربية للمهنيين في السعودية." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300C8FF'/><text x='16' y='23' font-family='Arial' font-size='18' font-weight='900' fill='%2304080F' text-anchor='middle'>ح</text></svg>" />
    <title>حُضور — سيرة ذاتية ATS ونماذج Word وتحسين ملف لينكد إن</title>
    <script>
      /* السمة قبل أول رسم — النهاري هو الافتراضي (ADR-013).
         localStorage قد يكون محجوباً على file:// في بعض المتصفحات، فيُتجاهل بهدوء. */
      (function () {
        try {
          var t = localStorage.getItem('hudur:theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* يبقى النهاري */ }
      })();
    </script>
